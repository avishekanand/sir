name: trec-covid-bayes-v1

dataset:
  name: trec-covid
  irds_id: irds:beir/trec-covid

# Trial budget
n_trials: 300
n_startup_trials: 60       # random exploration before TPE engages
n_parallel_workers: 1      # sequential (global config singleton is not thread-safe)
n_eval_queries: 50         # sample of queries per trial; raise to 200+ for publication

seed: 42

# Persistence: store results to SQLite so the study can be resumed
storage_url: "sqlite:///tuning_results/trec-covid-bayes-v1.db"

# Pruner thresholds
max_mean_rerank_docs: 40.0   # abort trial if mean rerank cost per query exceeds this
max_trial_seconds: 90.0      # abort trial if projected wall time exceeds this
pareto_warmup_trials: 40     # ParetoPruner inactive until this many trials complete

output_dir: tuning_results/trec-covid-bayes-v1

# ── Search space ──────────────────────────────────────────────────────────────
# MUST be identical to tune_trec_covid_llm.yaml for a fair comparison.
search_space_overrides:
  reranker_types:
    - noop
    - cross-encoder
    - monot5
  reformulator_types:
    - identity
  estimator_types:
    - baseline
    - utility
    - similarity
  scheduler_types:
    - active-learning
    - graceful-degradation
  feedback_types:
    - none
    - budget-stop
