name: trec-covid-llm-v1

# LLM used for reflection and proposal (any litellm-compatible model string)
llm_model: gpt-4o-mini
temperature: 0.7

# How many prior iterations the agent sees in its prompt
max_history_in_prompt: 20

# Optimization budget
n_iterations: 50

# Evaluation settings — 50 queries matches the full TREC-COVID set
n_eval_queries: 50
seed: 42

# Dataset (ir-datasets BEIR TREC-COVID)
dataset:
  name: trec-covid
  irds_id: irds:beir/trec-covid

# Output directory for Pareto-optimal YAML configs
output_dir: tuning_results/trec-covid-llm-v1

# ── Search space ──────────────────────────────────────────────────────────────
# MUST be identical to tune_trec_covid.yaml for a fair comparison.
search_space_overrides:
  reranker_types:
    - noop
    - cross-encoder
    - monot5
  reformulator_types:
    - identity
  estimator_types:
    - baseline
    - utility
    - similarity
  scheduler_types:
    - active-learning
    - graceful-degradation
  feedback_types:
    - none
    - budget-stop
